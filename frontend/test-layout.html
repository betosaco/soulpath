<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-2xl font-bold mb-8">Layout Test</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-blue-100 p-6 rounded-lg">
                <h2 class="text-xl font-semibold mb-4">Left Column</h2>
                <p>This should be on the left on large screens and full width on mobile.</p>
            </div>
            
            <div class="bg-green-100 p-6 rounded-lg">
                <h2 class="text-xl font-semibold mb-4">Right Column</h2>
                <p>This should be on the right on large screens and full width on mobile.</p>
            </div>
        </div>
    </div>
</body>
</html>
